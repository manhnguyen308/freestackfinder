{{ define "main" }}
<section class="search-page">
  <div class="container">

    <div class="search-page-header">
      <h1>Search</h1>
      <p class="search-page-sub">Find the right free software guide for you.</p>
    </div>

    <div class="search-bar-wrap">
      <label for="search-input" class="sr-only">Search articles</label>
      <div class="search-bar">
        <svg class="search-icon-inline" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search-input" placeholder="Search free tools, alternatives, and comparisons…" autocomplete="off" spellcheck="false" />
      </div>
    </div>

    <div class="search-filters" role="group" aria-label="Filter by category">
      <button type="button" class="filter-btn active" data-filter="" aria-pressed="true">All</button>
      <button type="button" class="filter-btn" data-filter="Creative" aria-pressed="false">Creative</button>
      <button type="button" class="filter-btn" data-filter="Productivity" aria-pressed="false">Productivity</button>
      <button type="button" class="filter-btn" data-filter="Video" aria-pressed="false">Video</button>
      <button type="button" class="filter-btn" data-filter="Business" aria-pressed="false">Business</button>
      <button type="button" class="filter-btn" data-filter="Security" aria-pressed="false">Security</button>
      <button type="button" class="filter-btn" data-filter="Cloud" aria-pressed="false">Cloud</button>
    </div>

    <div id="search-results" aria-live="polite" aria-atomic="true"></div>

  </div>
</section>
{{ end }}

{{ define "scripts" }}
<script src="{{ partialCached "asset-url.html" "js/search.js" "js/search.js" }}" defer></script>
{{ end }}
