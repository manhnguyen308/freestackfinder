baseURL = "https://freestackfinder.com/"
languageCode = "en-us"
title = "Free Stack Finder"
enableRobotsTXT = true
enableGitInfo = false
summarylength = 40

[params]
  description = "Comparisons of free design, office, business, cloud, security, and video software, with the limit that ends each free plan."
  author = "FreeStackFinder Team"
  tagline = "Stop paying for software you don't have to."
  email = "contact@freestackfinder.com"
  ogImage = "/img/default-article.jpg"
  adsensePublisherId = "ca-pub-5934721249825043"
  showAds = false

[params.authorProfile]
  # Real site-owner author identity. Fill these before the next deploy.
  # Any field left blank falls back to the generic team byline, so the live
  # site stays safe until real details are supplied.
  name = ""   # AUTHOR_NAME_PLACEHOLDER: real author full name, e.g. "Jane Doe"
  role = ""   # optional title, e.g. "Editor"
  bio = ""    # AUTHOR_BIO_PLACEHOLDER: 1 to 2 sentences; no "we tested" claims unless verified
  photo = ""  # AUTHOR_PHOTO_PLACEHOLDER: optional, e.g. "/img/authors/jane.webp"

[params.social]
  twitter = ""
  pinterest = ""

[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "keywords"
    weight = 50

# Hugo 0.128+ ignores the old top-level "paginate" key, so the page size lives here
[pagination]
  pagerSize = 12

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[outputs]
  home = ["HTML", "JSON"]
  page = ["HTML"]
  section = ["HTML"]

[menu]
  [[menu.main]]
    name = "Start Here"
    url = "/start-here/"
    weight = 0
  [[menu.main]]
    name = "Creative"
    url = "/creative/"
    weight = 1
  [[menu.main]]
    name = "Productivity"
    url = "/productivity/"
    weight = 2
  [[menu.main]]
    name = "Video"
    url = "/video/"
    weight = 3
  [[menu.main]]
    name = "Business"
    url = "/business/"
    weight = 4
  [[menu.main]]
    name = "Security"
    url = "/security/"
    weight = 5
  [[menu.main]]
    name = "Cloud"
    url = "/cloud/"
    weight = 6

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
